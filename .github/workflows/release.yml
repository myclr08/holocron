name: release

# Etiket itildiginde calisir; elle de tetiklenebilir (yalnizca zip uretir,
# etiket olmadan release'e bir sey eklenmez).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  EMBED_VERSION: "3.13.8"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tekerlekleri indir (manylinux2014 / cp313)
        run: |
          python -m pip install --upgrade pip
          pip download --only-binary=:all: \
            --python-version ${{ env.PYTHON_VERSION }} \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            -r requirements.txt -d wheels
          ls -1 wheels

      - name: Paketi uret
        run: python tools/build_portable.py --target linux --wheels wheels --version ${{ github.ref_name }}

      # Teams yapi sondasi: saf Python, tekerlek gerektirmez. Uygulama
      # paketlerine girmez, kendi zip'iyle release'e eklenir.
      - name: Teams sondasini paketle
        run: python tools/build_portable.py --probe

      - uses: actions/upload-artifact@v4
        with:
          name: holocron-linux
          path: |
            dist/holocron-linux-x64.zip
            dist/holocron-teams-probe.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tekerlekleri indir (win_amd64 / cp313)
        run: |
          python -m pip install --upgrade pip
          pip download --only-binary=:all: --python-version ${{ env.PYTHON_VERSION }} --platform win_amd64 --implementation cp -r requirements.txt -d wheels
          dir wheels

      # Gorusme notlarinin yaziya dokme katmani: `faster-whisper` ve
      # `ctranslate2` birkac yuz megabayt tutuyor, uygulama paketine girmez.
      # Ayri bir zip olarak release'e eklenir; cp313 tekerlegi yoksa is
      # dusmesin diye adim hatayi yutar (README elle kurulumu anlatiyor).
      - name: Yaziya dokme tekerlekleri (istege bagli)
        continue-on-error: true
        run: |
          pip download --only-binary=:all: --python-version ${{ env.PYTHON_VERSION }} --platform win_amd64 --implementation cp faster-whisper -d whisper-wheels
          dir whisper-wheels

      - name: Yaziya dokme paketini sikistir
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path whisper-wheels) {
            New-Item -ItemType Directory -Force -Path dist | Out-Null
            Compress-Archive -Path whisper-wheels\* -DestinationPath dist\holocron-windows-whisper.zip -Force
          }

      - name: Embed dagitimini indir
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/$env:EMBED_VERSION/python-$env:EMBED_VERSION-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip

      - name: Tam paketi uret (python-embed ile)
        run: >
          python tools/build_portable.py
          --target windows
          --embed-zip python-embed.zip
          --wheels wheels
          --version ${{ github.ref_name }}
          --python-version ${{ env.PYTHON_VERSION }}

      # Hedef makinede Python zaten kuruluysa embed olu yuk: binlerce kucuk
      # dosya zipten yavas cikiyor. Lite paket yalnizca app/ + wheels/ tasir.
      - name: Lite paketi uret (python-embed yok)
        run: >
          python tools/build_portable.py
          --target windows
          --no-embed
          --wheels wheels
          --version ${{ github.ref_name }}
          --python-version ${{ env.PYTHON_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: holocron-windows
          path: |
            dist/holocron-windows-x64.zip
            dist/holocron-windows-x64-lite.zip
            dist/holocron-windows-whisper.zip
          if-no-files-found: warn

  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Etiket ile koddaki surum ayrilirsa release yanlis numarayla cikar ve
      # arayuzdeki "s<surum>" rozeti indirilen zip ile tutmaz: is burada duser.
      - name: Etiket ile sürüm eşleşmeli
        run: |
          python - <<'EOF'
          import os, re, sys, pathlib
          tag = os.environ["TAG"]
          text = pathlib.Path("app/__init__.py").read_text(encoding="utf-8")
          found = re.search(r'__version__ = "([^"]+)"', text).group(1)
          if tag != f"v{found}":
              sys.exit(f"Etiket {tag} ile app/__init__.py surumu {found} uyusmuyor.")
          print(f"Surum dogrulandi: {tag}")
          EOF
        env:
          TAG: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
