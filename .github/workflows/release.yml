name: release

on:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.12"
  EMBED_VERSION: "3.12.8"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Wheel'leri topla
        run: |
          python -m pip install --upgrade pip wheel
          pip wheel -r requirements.txt -w wheels

      - name: Paketi hazirla
        run: |
          mkdir -p dist/holocron
          cp -r app holocron.sh requirements.txt README.md LICENSE dist/holocron/
          cp -r wheels dist/holocron/wheels
          find dist/holocron -name '__pycache__' -type d -prune -exec rm -rf {} +
          chmod +x dist/holocron/holocron.sh
          cd dist && zip -qr "holocron-linux-${GITHUB_REF_NAME}.zip" holocron

      - uses: actions/upload-artifact@v4
        with:
          name: holocron-linux
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Wheel'leri topla
        run: |
          python -m pip install --upgrade pip wheel
          pip wheel -r requirements.txt -w wheels

      - name: Embed dagitimini indir
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/$env:EMBED_VERSION/python-$env:EMBED_VERSION-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip

      - name: Tasinabilir paketi uret
        run: >
          python tools/build_portable.py
          --embed-zip python-embed.zip
          --wheels wheels
          --version ${{ github.ref_name }}
          --python-version ${{ env.PYTHON_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: holocron-windows
          path: dist/*.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
