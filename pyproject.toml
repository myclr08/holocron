[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holocron"
version = "0.10.7"
description = "Yerel Jira kayit takip araci"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mustafa Yüceler" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "openpyxl",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/css/*", "static/js/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: gercek surec baslatan testler"]
