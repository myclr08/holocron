<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Holocron</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="layout">
    <div class="brand">HOLOCRON <span class="badge" id="version"></span></div>

    <header class="topbar">
      <div class="topbar-left">
        <button class="primary" id="refresh-all" title="Tum gruplari Jira'dan tazeler">Guncelle</button>
        <button class="danger" id="refresh-cancel" hidden>Iptal</button>
        <div class="progress" id="progress" hidden>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <span class="progress-stage" id="progress-stage"></span>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="button" href="/settings">Ayarlar</a>
        <button class="danger" data-action="shutdown">Kapat</button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Hangar</h2>
        <button id="new-group" title="Yeni grup olustur">+ Yeni Filo</button>
      </div>
      <div id="group-list"></div>
    </aside>

    <main class="main">
      <section class="placeholder" id="placeholder">
        <h2>Holocron hazir</h2>
        <p class="hint" id="connection-hint">Baglanti durumu okunuyor...</p>
        <p class="hint">
          Soldaki <strong>Yeni Filo</strong> ile bir grup acin. Manuel grupta anahtarlari elle
          yapistirirsiniz; JQL filtresinde uyelik her Guncelle'de sorgudan gelir.
        </p>
      </section>

      <section id="group-view" hidden>
        <div class="group-head">
          <div class="group-title">
            <span class="color-strip" id="group-color"></span>
            <h2 id="group-name"></h2>
            <span class="badge" id="group-kind"></span>
            <span class="badge" id="group-count"></span>
          </div>
          <div class="group-actions">
            <button id="edit-group">Duzenle</button>
            <button class="danger" id="delete-group">Sil</button>
          </div>
        </div>
        <div class="jql-line" id="group-jql" hidden></div>

        <div class="toolbar">
          <button id="add-items">Kayit ekle</button>
          <button id="choose-columns">Sutunlar</button>
          <button id="refresh-group">Guncelle (bu grup)</button>
          <input type="search" id="search" placeholder="Ara ( / )" autocomplete="off" />
          <span class="hint" id="row-count"></span>
        </div>

        <div class="grid-wrap">
          <table class="grid" id="grid">
            <thead><tr id="grid-head"></tr></thead>
            <tbody id="grid-body"></tbody>
          </table>
          <div class="empty" id="grid-empty" hidden>
            <p>Bu sektorde kayit yok.</p>
            <button id="empty-add">Kayit ekle</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <header class="drawer-head">
      <div class="drawer-title">
        <strong id="drawer-key"></strong>
        <a id="drawer-link" target="_blank" rel="noopener" hidden>Jira'da ac</a>
      </div>
      <button id="drawer-close" title="Kapat (Esc)">✕</button>
    </header>
    <label class="checkbox drawer-toggle">
      <input type="checkbox" id="drawer-empty" />
      Bos alanlari da goster
    </label>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <strong id="modal-title"></strong>
        <button id="modal-close" title="Kapat (Esc)">✕</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
